<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Упражнение — порядок слов</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&amp;family=Onest:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#CBEF6B}a:hover{color:#FFFFFF}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 62px 20px 34px; background: #0F1A14; font-family: Onest, system-ui, sans-serif; color: #F3F4EF; display: flex; flex-direction: column; gap: 20px;">

  <div style="display: flex; align-items: center; gap: 14px;">
    <a href="Today.dc.html" aria-label="Закрыть" style="width: 44px; height: 44px; border-radius: 50%; background: #1C2A22; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F3F4EF" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <div style="flex-grow: 1; height: 6px; border-radius: 3px; background: #33443A; overflow: hidden;"><div style="width: 72%; height: 6px; background: #CBEF6B;"></div></div>
    <span style="font-size: 14px; font-weight: 600; color: #A9B5AD;">13/18</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 1.4px; color: #CBEF6B;">ПОРЯДОК СЛОВ · A1-06</span>
    <h2 style="margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 26px; line-height: 1.15; letter-spacing: -0.5px;">Составьте вопрос «Как тебя зовут?»</h2>
    <span style="font-size: 14px; color: #A9B5AD;">Не забудьте оба знака — в начале и в конце.</span>
  </div>

  <div style="min-height: 132px; border-radius: 28px; border: 2px dashed #33443A; padding: 16px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px;">
    <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
      <span style="font-size: 15px; color: #6E7B73; padding: 10px 4px;">Нажимайте на слова ниже</span>
    </sc-if>
    <sc-for list="{{ picked }}" as="t" hint-placeholder-count="3">
      <button onClick="{{ t.remove }}" style="border: 0; padding: 10px 16px; border-radius: 16px; background: #FFFFFF; color: #0F1A14; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 26px; line-height: 1;">{{ t.label }}</button>
    </sc-for>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;">
    <sc-for list="{{ pool }}" as="t" hint-placeholder-count="5">
      <sc-if value="{{ t.used }}" hint-placeholder-val="{{ false }}">
        <span aria-hidden="true" style="padding: 10px 16px; border-radius: 16px; background: #1C2A22; color: #1C2A22; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 26px; line-height: 1;">{{ t.label }}</span>
      </sc-if>
      <sc-if value="{{ t.free }}" hint-placeholder-val="{{ true }}">
        <button onClick="{{ t.pick }}" style="border: 0; padding: 10px 16px; border-radius: 16px; background: #2A3B31; color: #F3F4EF; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 26px; line-height: 1; box-shadow: 0 3px 0 #0A120D;">{{ t.label }}</button>
      </sc-if>
    </sc-for>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px;">
    <sc-if value="{{ isRight }}" hint-placeholder-val="{{ false }}">
      <div style="border-radius: 24px; background: #CBEF6B; color: #0F1A14; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px;">
        <b style="font-family: Unbounded, sans-serif; font-size: 20px;">¡Perfecto!</b>
        <span style="font-size: 14px; line-height: 1.4;">Вопрос обрамляется двумя знаками: <i style="font-family: 'Instrument Serif', serif; font-size: 18px;">¿Cómo te llamas?</i></span>
      </div>
      <a href="SessionDone.dc.html" style="text-decoration: none; text-align: center; background: #CBEF6B; color: #0F1A14; padding: 19px; border-radius: 999px; font-weight: 700; font-size: 17px;">Дальше</a>
    </sc-if>
    <sc-if value="{{ isWrong }}" hint-placeholder-val="{{ false }}">
      <div style="border-radius: 24px; background: #3A1F19; color: #FFD3C8; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px;">
        <b style="font-family: Unbounded, sans-serif; font-size: 20px; color: #FF9B85;">Почти</b>
        <span style="font-size: 14px; line-height: 1.4;">Правильно: <i style="font-family: 'Instrument Serif', serif; font-size: 18px;">¿Cómo te llamas?</i> — карточка вернётся через 10 минут.</span>
      </div>
      <button onClick="{{ reset }}" style="border: 0; background: #F3F4EF; color: #0F1A14; padding: 19px; border-radius: 999px; font: 700 17px Onest, sans-serif;">Ещё раз</button>
    </sc-if>
    <sc-if value="{{ showCheck }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ check }}" style="border: 0; background: {{ checkBg }}; color: {{ checkFg }}; padding: 19px; border-radius: 999px; font: 700 17px Onest, sans-serif;">Проверить</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tokens = ['¿', 'Cómo', 'te', 'llamas', '?'];
    const order = [3, 0, 2, 4, 1];
    const st = this.state || {};
    const picked = st.picked || [];
    const checked = !!st.checked;
    const full = picked.length === tokens.length;
    const right = picked.map((i) => tokens[i]).join(' ') === tokens.join(' ');
    return {
      isEmpty: picked.length === 0,
      picked: picked.map((i, pos) => ({
        label: tokens[i],
        remove: () => { if (!checked) this.setState({ picked: picked.filter((_, p) => p !== pos) }); }
      })),
      pool: order.map((i) => {
        const used = picked.indexOf(i) !== -1;
        return {
          label: tokens[i], used: used, free: !used,
          pick: () => { if (!checked) this.setState({ picked: picked.concat([i]) }); }
        };
      }),
      showCheck: !checked,
      checkBg: full ? '#CBEF6B' : '#2A3B31',
      checkFg: full ? '#0F1A14' : '#8A968F',
      check: () => { if (full) this.setState({ checked: true }); },
      isRight: checked && right,
      isWrong: checked && !right,
      reset: () => this.setState({ picked: [], checked: false })
    };
  }
}
</script>
</body>
</html>
