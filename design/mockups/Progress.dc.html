<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Прогресс</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&amp;family=Onest:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E7C47}a:hover{color:#0A5C35}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 62px 20px 0; background: #F3F4EF; font-family: Onest, system-ui, sans-serif; color: #0F1A14; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden;">

  <h1 style="margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -1px;">Прогресс</h1>

  <div style="display: grid; grid-template-columns: 1.3fr 1fr; gap: 10px;">
    <div style="background: #E5482A; color: #0F1A14; border-radius: 28px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; min-height: 140px;">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0F1A14" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4 0 7-2.7 7-6.8 0-3.6-2.6-6-4.2-8.7-.4 2.1-1.5 3.3-2.8 3.9C12.6 6.9 11 4 8.6 2 8.9 6 5 8.4 5 13.6 5 18.9 8.2 22 12 22z"></path></svg>
      <div><b style="font-family: Unbounded, sans-serif; font-size: 52px; line-height: 0.9;">13</b><div style="font-size: 14px; font-weight: 600; margin-top: 4px;">дней подряд</div></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="flex-grow: 1; background: #FFFFFF; border-radius: 22px; padding: 12px 14px;"><b style="font-family: Unbounded, sans-serif; font-size: 22px;">21</b><div style="font-size: 12px; color: #56625B;">лучшая серия</div></div>
      <div style="flex-grow: 1; background: #FFFFFF; border-radius: 22px; padding: 12px 14px;"><b style="font-family: Unbounded, sans-serif; font-size: 22px;">412</b><div style="font-size: 12px; color: #56625B;">повторений всего</div></div>
    </div>
  </div>

  <div style="background: #FFFFFF; border-radius: 28px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; justify-content: space-between; font-size: 14px;"><b>12 недель</b><span style="color: #56625B;">412 повторений</span></div>
    <div style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-template-rows: repeat(7, 18px); grid-auto-flow: column; gap: 4px;">
      <sc-for list="{{ cells }}" as="c" hint-placeholder-count="84">
        <span style="border-radius: 5px; background: {{ c.bg }};"></span>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: #56625B;">меньше <span style="width: 12px; height: 12px; border-radius: 3px; background: #E7EAE3;"></span><span style="width: 12px; height: 12px; border-radius: 3px; background: #9FD9B6;"></span><span style="width: 12px; height: 12px; border-radius: 3px; background: #3BB273;"></span><span style="width: 12px; height: 12px; border-radius: 3px; background: #0A5C35;"></span> больше</div>
  </div>

  <div style="background: #FFFFFF; border-radius: 28px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; justify-content: space-between; font-size: 14px;"><b>В долгой памяти</b><span style="color: #56625B;">интервал больше 21 дня</span></div>
    <div style="display: grid; grid-template-columns: 32px minmax(0, 1fr) 40px; gap: 8px; align-items: center; font-size: 13px;"><b style="font-family: Unbounded, sans-serif;">A1</b><div style="height: 10px; border-radius: 5px; background: #E7EAE3; overflow: hidden;"><div style="width: 70%; height: 10px; background: #0E7C47;"></div></div><span style="text-align: right;">21/30</span></div>
    <div style="display: grid; grid-template-columns: 32px minmax(0, 1fr) 40px; gap: 8px; align-items: center; font-size: 13px;"><b style="font-family: Unbounded, sans-serif;">A2</b><div style="height: 10px; border-radius: 5px; background: #E7EAE3; overflow: hidden;"><div style="width: 24%; height: 10px; background: #0E7C47;"></div></div><span style="text-align: right;">7/29</span></div>
    <div style="display: grid; grid-template-columns: 32px minmax(0, 1fr) 40px; gap: 8px; align-items: center; font-size: 13px;"><b style="font-family: Unbounded, sans-serif;">B1</b><div style="height: 10px; border-radius: 5px; background: #E7EAE3; overflow: hidden;"><div style="width: 4%; height: 10px; background: #0E7C47;"></div></div><span style="text-align: right;">1/25</span></div>
  </div>

  <nav aria-label="Разделы" style="position: absolute; left: 20px; right: 20px; bottom: 28px; height: 64px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid #DDE1DA; box-shadow: 0 12px 32px rgba(15,26,20,0.12); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; padding: 0 6px;">
    <a href="Today.dc.html" aria-label="Сегодня" style="height: 52px; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0F1A14" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></a>
    <a href="Catalog.dc.html" aria-label="Каталог" style="height: 52px; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0F1A14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20c3-6 6-10 9-10s4 3 9-6"></path><circle cx="3" cy="20" r="1.5"></circle><circle cx="21" cy="4" r="1.5"></circle></svg></a>
    <a href="Progress.dc.html" aria-label="Прогресс" style="height: 52px; border-radius: 999px; background: #0F1A14; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#CBEF6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4 0 7-2.7 7-6.8 0-3.6-2.6-6-4.2-8.7-.4 2.1-1.5 3.3-2.8 3.9C12.6 6.9 11 4 8.6 2 8.9 6 5 8.4 5 13.6 5 18.9 8.2 22 12 22z"></path></svg></a>
    <a href="Main.dc.html" aria-label="Настройки" style="height: 52px; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0F1A14" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const shades = ['#E7EAE3', '#9FD9B6', '#3BB273', '#0A5C35'];
    const cells = [];
    for (let i = 0; i < 84; i++) {
      let v;
      if (i >= 71) v = (i === 83) ? 0 : 2 + (i % 2);
      else if (i < 14) v = (i * 7) % 5 === 0 ? 1 : 0;
      else v = ((i * 13) % 7 === 0) ? 0 : 1 + ((i * 5) % 3);
      cells.push({ bg: shades[v] });
    }
    return { cells: cells };
  }
}
</script>
</body>
</html>
