name: Lorito
options:
  bundleIdPrefix: com.toffguy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  LoritoKit:
    path: Packages/LoritoKit
  TelemetryDeck:
    url: https://github.com/TelemetryDeck/SwiftSDK
    from: 2.14.2

targets:
  Lorito:
    type: application
    platform: iOS
    sources:
      - path: Lorito/Sources
      - path: Lorito/Assets.xcassets
    configFiles:
      Debug: Lorito/Config.xcconfig
      Release: Lorito/Config.xcconfig
    dependencies:
      - package: LoritoKit
        product: Features
      - package: TelemetryDeck
      - target: LoritoWidgets
    # Explicit Info.plist (generated by XcodeGen) so we can declare custom keys
    # like UIBackgroundModes, which GENERATE_INFOPLIST_FILE can't inject.
    info:
      path: Lorito/Info.plist
      properties:
        CFBundleDisplayName: Lorito Español
        TelemetryDeckAppID: "$(TELEMETRYDECK_APP_ID)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # CloudKit needs remote-notification background mode for push-driven sync.
        UIBackgroundModes:
          - remote-notification
        # Study-session Live Activity.
        NSSupportsLiveActivities: true
        # Widgets deep-link to Today via lorito://today.
        CFBundleURLTypes:
          - CFBundleURLName: com.toffguy.lorito
            CFBundleURLSchemes:
              - lorito
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toffguy.lorito
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "11"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: "3GWRDGA8B7"
        CODE_SIGN_STYLE: Automatic
        # CloudKit: activates private-DB sync (iCloud capability + container on the
        # App ID + production CloudKit schema already deployed).
        CODE_SIGN_ENTITLEMENTS: Lorito/Lorito.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LORITO_CLOUDKIT"

  # Home Screen / Lock Screen widgets + session Live Activity. Reads only the
  # App Group snapshot (group.com.toffguy.lorito); no SwiftData/CloudKit.
  LoritoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LoritoWidgets
        excludes:
          - "*.entitlements"
          - Info.plist
    dependencies:
      - package: LoritoKit
        product: Domain
      - package: LoritoKit
        product: DesignSystem
      - package: LoritoKit
        product: WidgetSupport
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
      - sdk: AppIntents.framework
    info:
      path: LoritoWidgets/Info.plist
      properties:
        CFBundleDisplayName: Lorito
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toffguy.lorito.widgets
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "11"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: "3GWRDGA8B7"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: LoritoWidgets/LoritoWidgets.entitlements
        SKIP_INSTALL: YES

  LoritoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LoritoUITests
    dependencies:
      - target: Lorito
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toffguy.lorito.uitests
        DEVELOPMENT_TEAM: "3GWRDGA8B7"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Lorito:
    build:
      targets:
        Lorito: all
        LoritoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LoritoUITests
    archive:
      config: Release
