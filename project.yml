name: Lorito
options:
  bundleIdPrefix: com.toffguy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  LoritoKit:
    path: Packages/LoritoKit
  TelemetryDeck:
    url: https://github.com/TelemetryDeck/SwiftSDK
    from: 2.14.2
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 9.29.0

targets:
  Lorito:
    type: application
    platform: iOS
    sources:
      - path: Lorito/Sources
      - path: Shared
      - path: Lorito/Assets.xcassets
    configFiles:
      Debug: Lorito/Config.xcconfig
      Release: Lorito/Config.xcconfig
    dependencies:
      - package: LoritoKit
        product: Features
      - package: TelemetryDeck
      - package: Sentry
        product: Sentry
      - target: LoritoWidgets
      - target: LoritoLensAction
    # Explicit Info.plist (generated by XcodeGen) so we can declare custom keys
    # like UIBackgroundModes, which GENERATE_INFOPLIST_FILE can't inject.
    info:
      path: Lorito/Info.plist
      properties:
        CFBundleDisplayName: Lorito Español
        TelemetryDeckAppID: "$(TELEMETRYDECK_APP_ID)"
        SentryDSN: "$(SENTRY_DSN)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "Lorito слушает, как вы произносите фразу в упражнении «Скажите вслух», и сравнит её с образцом. Запись не сохраняется и никуда не отправляется."
        NSCameraUsageDescription: "Lorito распознаёт испанский текст с камеры прямо на устройстве, чтобы разобрать в нём грамматику. Снимки не сохраняются и никуда не отправляются."
        NSSpeechRecognitionUsageDescription: "Распознавание речи идёт только на устройстве: так Lorito проверяет произношение в упражнениях «Скажите вслух»."
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # CloudKit needs remote-notification background mode for push-driven sync.
        UIBackgroundModes:
          - remote-notification
        # Study-session Live Activity.
        NSSupportsLiveActivities: true
        # Study buddy: accept CloudKit share invites.
        CKSharingSupported: true
        # Widgets deep-link to Today via lorito://today.
        CFBundleURLTypes:
          - CFBundleURLName: com.toffguy.lorito
            CFBundleURLSchemes:
              - lorito
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toffguy.lorito
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "14"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: "3GWRDGA8B7"
        CODE_SIGN_STYLE: Automatic
        # CloudKit: activates private-DB sync (iCloud capability + container on the
        # App ID + production CloudKit schema already deployed).
        CODE_SIGN_ENTITLEMENTS: Lorito/Lorito.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LORITO_CLOUDKIT"

  # Home Screen / Lock Screen widgets + session Live Activity. Reads only the
  # App Group snapshot (group.com.toffguy.lorito); no SwiftData/CloudKit.
  LoritoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LoritoWidgets
        excludes:
          - "*.entitlements"
          - Info.plist
      - path: Shared
    configFiles:
      Debug: Lorito/Config.xcconfig
      Release: Lorito/Config.xcconfig
    dependencies:
      - package: Sentry
        product: Sentry
      - package: LoritoKit
        product: Domain
      - package: LoritoKit
        product: DesignSystem
      - package: LoritoKit
        product: WidgetSupport
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
      - sdk: AppIntents.framework
    info:
      path: LoritoWidgets/Info.plist
      properties:
        CFBundleDisplayName: Lorito
        SentryDSN: "$(SENTRY_DSN)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toffguy.lorito.widgets
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "14"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: "3GWRDGA8B7"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: LoritoWidgets/LoritoWidgets.entitlements
        SKIP_INSTALL: YES

  # Grammar Lens Action extension: «Разобрать в Lorito» for shared plain text.
  # Shows results only; the text is passed to the app in the lorito://lens URL.
  LoritoLensAction:
    type: app-extension
    platform: iOS
    sources:
      - path: LoritoLensAction
        excludes:
          - Info.plist
      - path: Shared
    configFiles:
      Debug: Lorito/Config.xcconfig
      Release: Lorito/Config.xcconfig
    dependencies:
      - package: Sentry
        product: Sentry
      - package: LoritoKit
        product: Features
      - sdk: UIKit.framework
      - sdk: SwiftUI.framework
    info:
      path: LoritoLensAction/Info.plist
      properties:
        CFBundleDisplayName: Разобрать в Lorito
        SentryDSN: "$(SENTRY_DSN)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ui-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ActionViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
            NSExtensionServiceRoleType: NSExtensionServiceRoleTypeViewer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toffguy.lorito.lens
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "14"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: "3GWRDGA8B7"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

  LoritoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LoritoUITests
    dependencies:
      - target: Lorito
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toffguy.lorito.uitests
        DEVELOPMENT_TEAM: "3GWRDGA8B7"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Lorito:
    build:
      targets:
        Lorito: all
        LoritoUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Lorito/Lorito.storekit
    test:
      config: Debug
      targets:
        - LoritoUITests
    archive:
      config: Release
